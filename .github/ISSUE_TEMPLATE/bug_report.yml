name: Bug report
description: Something in Frida.ai does not work as expected.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem. **Do not paste real chat content, names of real people, API keys or tokens.** Use fictional data (for example, Contoso) when you describe what happened.

        Security problems must not be reported here: follow the [security policy](https://github.com/LargoLujan/frida-ai/security/policy) instead.

  - type: input
    id: version
    attributes:
      label: App version
      description: Release tag or commit you are running.
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: dropdown
    id: install
    attributes:
      label: How did you install it?
      options:
        - Installer (Frida.ai-Setup)
        - Built from source (dotnet run or dotnet build)
    validations:
      required: true

  - type: input
    id: windows
    attributes:
      label: Windows version
      description: Edition and version, for example from `winver`.
      placeholder: "Windows 11 24H2"
    validations:
      required: true

  - type: dropdown
    id: source-mode
    attributes:
      label: Source mode
      options:
        - Embedded Teams (browser, default)
        - Microsoft Graph (graph)
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Model provider
      description: The drafting provider (`Provider` setting).
      options:
        - Claude (cloud)
        - OpenAI (cloud)
        - Gemini (cloud)
        - Ollama (local)
        - Simulation (no API call)
    validations:
      required: true

  - type: input
    id: triage
    attributes:
      label: Triage provider and models
      description: Optional. For example "Triage on Ollama, drafting with a cloud model".

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: What you did, step by step.
      placeholder: |
        1. Open a chat
        2. Click "Sugerir respuesta"
        3. ...
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behaviour
      description: Include the message shown in the panel or in Diagnostics, if any.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: |
        Relevant lines from `%LOCALAPPDATA%\TeamsJarvis\logs\jarvis-YYYYMMDD.log` or `crash.log`.
        These logs are not encrypted and contain chat and author names, tool inputs and sometimes model output. **Remove chat content, names, chat IDs, keys and tokens before pasting.**
      render: text

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This report contains no real chat content, no names of real people and no API keys or tokens.
          required: true
