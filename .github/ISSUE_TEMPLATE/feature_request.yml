name: Feature request
description: Suggest an improvement or a new feature for Frida.ai.
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea. Please keep examples fictional (for example, Contoso): **no real chat content, names of real people, API keys or tokens.**

        Some behaviour is deliberate: Frida.ai only proposes text and never sends messages for you, its native tools are read-only, and in embedded mode no triage or analysis runs until you click **Sugerir respuesta**. See the [README](https://github.com/LargoLujan/frida-ai#overview) before proposing changes to these.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How you would like it to work.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Other approaches or workarounds you have tried.

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Reading Teams (embedded or Graph mode)
        - Suggestions, triage and the agent
        - AI providers and models
        - Tools and MCP servers
        - Local features (Ollama, RAG, search, notes, Today panel)
        - Cost panel and estimates
        - Privacy and data storage
        - Installer and signing
        - Documentation
        - Other
    validations:
      required: true

  - type: dropdown
    id: provider
    attributes:
      label: Model provider
      description: Optional. The provider this request is about, if any.
      options:
        - Not provider-specific
        - Claude (cloud)
        - OpenAI (cloud)
        - Gemini (cloud)
        - Ollama (local)
        - Simulation (no API call)

  - type: input
    id: version
    attributes:
      label: App version
      description: Optional. Release tag or commit you are running.
      placeholder: "v1.0.0"

  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: This request contains no real chat content, no names of real people and no API keys or tokens.
          required: true
